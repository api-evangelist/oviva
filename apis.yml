name: Oviva
description: 'Oviva is a European digital health company, founded in 2014, delivering personalized,
  dietitian-led care for people managing type 2 diabetes, obesity, and other diet-related conditions.
  It combines a mobile app for logging food, activity, and progress with human coaching from a network
  of 420+ dietitians, psychologists, and doctors, operating across the UK, Germany, and Switzerland and
  serving 900K+ people. Oviva is delivered as a regulated digital therapeutic (CE-marked, ISO 27001,
  NHS DTAC and CQC assessed) rather than through a public developer API; this profile captures its
  security, compliance, and legal surface. Backed by Partech.'
